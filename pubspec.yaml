name: hot_hair_app
description: A high-end hair salon booking application.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.1.0
  dio: ^5.4.0
  json_annotation: ^4.8.4
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.2
  image: ^4.8.0
  shared_preferences: ^2.3.2
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  url_launcher: ^6.3.2
  csp_amap_flutter_location:
    path: plugins/csp_amap_flutter_location
  maplibre_gl: 0.26.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/salon_placeholder.svg
    - assets/images/logo.png
    - assets/images/ad/
    - assets/icons/
    - assets/icons_png/
